version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME:-boilerplate}_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exvorta_${PROJECT_NAME:-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
